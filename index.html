<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chelsea+Market&display=swap"
    />
    <title>The Market</title>
  </head>
  <body>
    <header>
      <h1>The Market</h1>
    </header>

    <section class="filterButtons">
      <button class="filter" data-filter="all"><h2>All</h2></button>
      <button class="filter" data-filter="fruit"><h2>Fruits</h2></button>
      <button class="filter" data-filter="bread"><h2>Bread</h2></button>
      <button class="filter" data-filter="seafood"><h2>Seafood</h2></button>
      <button class="filter" data-filter="vegetables">
        <h2>Vegetables</h2>
      </button>
    </section>

    <section class="section"></section>
    <container class="cart">
      <h2>Shopping Cart</h2>
      <h2 class="cartTotal"></h2>
    </container>
    <script src="app.js"></script>
  </body>
</html>
